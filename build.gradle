plugins {
    id 'java'
    id "com.gradleup.shadow" version "9.4.1"
}

group = 'me.cocolennon'
version = '1.3.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    mavenLocal()

    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.65-stable'
    compileOnly 'com.palmergames.bukkit.towny:towny:0.103.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

shadowJar {
    archiveFileName = "TownySpawnMenu-${version}.jar"
    destinationDirectory = file('./builds')
}