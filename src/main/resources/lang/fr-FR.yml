# Modifier ce fichier vous permettra de changer ce que le plugin dit !
# Vous pouvez aussi créer d'autres fichiers de langue pour prendre en charge plus de langues en suivant le même format de nom que mon plugin et Minecraft
# Certains noeuds ont "%s" dans le texte. Ils sont remplacés par des valeurs fournies par le plugin, ne les oubliez pas dans les traductions !

prefix: "<#FFAA00>[Towny Spawn Menu]"
old-version: "<#00AAAA>Vous utilisez une ancienne version de Towny Spawn Menu, veuillez mettre à jour vers la version %s"
error:
  permission: "<#FF5555>Vous ne pouvez pas faire ça !"
  invalid:
    option: "<#FF5555>Option invalide !"
    item: "<#FF5555>Nom d'objet ou de bloc invalide !"
    region: "<#FF5555>Type de région invalide !"
  towny:
    not-in-nation: "<#FF5555>Vous n'êtes pas dans une nation !"
    not-king: "<#FF5555>Vous n'êtes pas le dirigeant de votre nation !"
    not-in-town: "<#FF5555>Vous n'êtes pas dans une ville !"
    not-mayor: "<#FF5555>Vous n'êtes pas le maire de votre ville !"
success:
  set-menu-item: "<#00AAAA>L'objet dans le menu pour <#FFFF55>%s <#00AAAA>est maintenant %s"
  default-item: "<#00AAAA>L'objet par défaut pour les villes et les nations est maintenant %s"
  menu-filler: "<#00AAAA>L'objet remplisseur de menu est maintenant %s"
  towns-at-war: "<#00AAAA>L'objet pour les villes en guerre est maintenant %s"
  nationless: "<#00AAAA>L'objet pour les villes sans nation est maintenant %s"
  private: "<#00AAAA>L'objet pour les villes privéees est maintenant %s"
  hide-town-nation: "<#FFFF55>%s <#00AAAA>est maintenant caché dans le menu !"
  show-town-nation: "<#FFFF55>%s <#00AAAA>est maintenant visible dans le menu !"
menu:
  title:
    nations: "<#FFAA00><bold>Towny<#FFFFFF>: <#00AAAA>Nations (%s/%s)"
    towns:
      main: "<#FFAA00><bold>Villes<#FFFFFF>: <#00AAAA>%s (%s/%s)"
      nationless: "<#FFAA00><bold>Villes<#FFFFFF>: <#00AAAA>Sans nation (%s/%s)"
      private: "<#FFAA00><bold>Villes<#FFFFFF>: <#00AAAA>Privées (%s/%s)"
      at-war: "<#FFAA00><bold>Villes<#FFFFFF>: <#00AAAA>En Guerre (%s/%s)"
  lore-lines:
    leader: "<#FFAA00><bold>Dirigeant<#FFFFFF>: <#00AAAA>%s"
    capital: "<#FFAA00><bold>Capitale<#FFFFFF>: <#00AA00>%s"
    towns: "<#FFAA00><bold>Villes<#FFFFFF>: <#5555FF>%s"
    residents: "<#FFAA00><bold>Résidents<#FFFFFF>: <#FF55FF>%s"
    nation: "<#FFAA00><bold>Nation<#FFFFFF>: <#00AAAA>%s"
    mayor: "<#FFAA00><bold>Maire<#FFFFFF>: <#00AA00>%s"
    spawn-cost:
      public: "<#FFAA00><bold>Prix de téléportation<#FFFFFF>: <#FF5555>%s"
      private: "<#FFAA00><bold>Prix de téléportation<#FFFFFF>: <#FF5555>Ville privée"
  towns:
    nationless: "<#FF5555><bold>Villes sans nation"
    private: "<#FF5555><bold>Villes privées"
    at-war: "<#FF5555><bold>Villes en guerre"
  hidden:
    nations: "<#FF5555><bold>Nation cachée"
    towns: "<#FF5555><bold>Ville cachée"
  next-page: "<#FFAA00><bold>Page suivante"
  previous-page: "<#FFAA00><bold>Page précédente"
  back-to-nations: "<#FFAA00><bold>Retour aux Nations"